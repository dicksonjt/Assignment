<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" width="1600" height="700">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a8d90"/>
      <stop offset="55%" stop-color="#b9bcbe"/>
      <stop offset="100%" stop-color="#d6d8d9"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3d"/>
      <stop offset="45%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="wheel" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#5a5a5a"/>
      <stop offset="60%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="windowGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9ea4a8"/>
      <stop offset="100%" stop-color="#4b5054"/>
    </linearGradient>
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1600" height="700" fill="url(#bgGrad)"/>

  <!-- Subtle horizon line -->
  <rect x="0" y="470" width="1600" height="2" fill="#00000012"/>

  <!-- Ground shadow under car -->
  <ellipse cx="800" cy="565" rx="620" ry="40" fill="url(#groundShadow)"/>

  <!-- Car body silhouette (side profile, Porsche 911-esque) -->
  <path d="
    M 220 500
    C 210 460, 250 430, 300 420
    C 330 380, 370 330, 430 300
    C 470 275, 520 260, 580 255
    C 610 220, 660 195, 720 190
    C 800 183, 880 190, 940 210
    C 1000 225, 1050 245, 1100 275
    C 1150 285, 1220 300, 1280 330
    C 1330 355, 1370 385, 1390 420
    C 1420 425, 1440 450, 1435 480
    C 1432 500, 1415 510, 1395 512
    L 1340 512
    C 1335 470, 1300 440, 1258 440
    C 1216 440, 1183 470, 1178 512
    L 480 512
    C 475 470, 440 440, 398 440
    C 356 440, 323 470, 318 512
    L 250 512
    C 228 510, 216 495, 220 500
    Z" fill="url(#carBody)" stroke="#000000" stroke-width="2"/>

  <!-- Roofline highlight -->
  <path d="M 580 255 C 610 220, 660 195, 720 190 C 800 183, 880 190, 940 210 C 1000 225, 1050 245, 1100 275"
        fill="none" stroke="#5c5c5f" stroke-width="3" opacity="0.6"/>

  <!-- Windows -->
  <path d="
    M 600 280
    C 640 245, 690 222, 740 218
    C 800 213, 860 220, 905 235
    C 930 244, 950 258, 965 275
    L 930 285
    C 880 268, 820 260, 760 262
    C 710 264, 665 272, 630 288
    Z" fill="url(#windowGlass)" opacity="0.9"/>

  <!-- Window divider -->
  <line x1="795" y1="222" x2="800" y2="278" stroke="#1a1a1a" stroke-width="4"/>

  <!-- Side skirt accent line -->
  <path d="M 340 430 C 500 415, 700 405, 900 405 C 1050 405, 1180 412, 1280 425"
        fill="none" stroke="#2c2c2e" stroke-width="2" opacity="0.7"/>

  <!-- Door line -->
  <path d="M 760 300 L 745 435" fill="none" stroke="#050505" stroke-width="2" opacity="0.6"/>

  <!-- Headlight -->
  <ellipse cx="1385" cy="340" rx="16" ry="10" fill="#e8e8e8" opacity="0.85"/>
  <!-- Taillight -->
  <ellipse cx="245" cy="420" rx="10" ry="16" fill="#8a1010" opacity="0.8"/>

  <!-- Door handle -->
  <rect x="820" y="340" width="26" height="5" rx="2" fill="#3a3a3a"/>

  <!-- Rear spoiler suggestion -->
  <path d="M 250 400 C 260 385, 285 378, 310 380" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round"/>

  <!-- Front wheel -->
  <circle cx="1258" cy="512" r="78" fill="url(#wheel)"/>
  <circle cx="1258" cy="512" r="78" fill="none" stroke="#050505" stroke-width="3"/>
  <circle cx="1258" cy="512" r="34" fill="#2a2a2a"/>
  <circle cx="1258" cy="512" r="34" fill="none" stroke="#606060" stroke-width="2"/>
  <g stroke="#707070" stroke-width="3">
    <line x1="1258" y1="490" x2="1258" y2="534"/>
    <line x1="1236" y1="512" x2="1280" y2="512"/>
    <line x1="1243" y1="497" x2="1273" y2="527"/>
    <line x1="1273" y1="497" x2="1243" y2="527"/>
  </g>

  <!-- Rear wheel -->
  <circle cx="398" cy="512" r="78" fill="url(#wheel)"/>
  <circle cx="398" cy="512" r="78" fill="none" stroke="#050505" stroke-width="3"/>
  <circle cx="398" cy="512" r="34" fill="#2a2a2a"/>
  <circle cx="398" cy="512" r="34" fill="none" stroke="#606060" stroke-width="2"/>
  <g stroke="#707070" stroke-width="3">
    <line x1="398" y1="490" x2="398" y2="534"/>
    <line x1="376" y1="512" x2="420" y2="512"/>
    <line x1="383" y1="497" x2="413" y2="527"/>
    <line x1="413" y1="497" x2="383" y2="527"/>
  </g>

  <!-- Top body highlight streak -->
  <path d="M 450 320 C 550 290, 700 270, 850 268 C 950 267, 1050 280, 1130 300"
        fill="none" stroke="#5a5a5d" stroke-width="2" opacity="0.5"/>
</svg>
